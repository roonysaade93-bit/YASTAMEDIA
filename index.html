<script>
    // ====================================================================
    // Solution Bot Logic (V2.0) - YASTAMEDIA Portfolio
    // ====================================================================

    const botOutput = document.getElementById('bot-output');
    const botInput = document.getElementById('bot-input');
    const botSend = document.getElementById('bot-send');
    const promptButtons = document.querySelectorAll('.bot-prompt-btn');

    // === Solution Bot Data & Logic ===

    /**
     * @description הגדרת נתונים: קייס סטאדיס והפניות ממופות מראש.
     */
    const SOLUTION_BOT_DATA = {
        // המידע שיוצג בבחירה מהירה (1, 2, 3)
        caseStudies: {
            leads: { title: "ייעול משפך לידים לחברת SAAS", text: "הבעיה: המרות נמוכות ועלויות גבוהות. הפתרון: הטמעת בוט AI לדירוג לידים אוטומטי. התוצאה: עלייה של 35% באיכות הלידים, קיצור מחזור מכירה ב-50%." },
            automation: { title: "אוטומציית CRM לחברת שירותים", text: "הבעיה: בזבוז זמן בניהול משימות ידני. הפתרון: חיבור פלטפורמות ואינטגרציה ל-ChatGPT למענה ראשוני. התוצאה: חסכון של 20 שעות שבועיות לכל עובד." },
            branding: { title: "מיתוג מחדש לחברת טכנולוגיה", text: "הבעיה: תדמית מיושנת. הפתרון: בניית אתר Neo-Futurism מודרני והגדרת קול מותג מונע דאטה. התוצאה: גידול של 150% במעורבות ובפניות ל-Tier 1." }
        },
        // מיפוי כוונות לשאלה חופשית (אופציה 4)
        intents: [
            { 
                keywords: ['סדנה', 'ללמוד', 'קורס', 'ai', 'ג\'פטו', 'chatgpt'],
                response: `[STATUS] זיהיתי צורך בהכשרת AI. אנו מציעים מודול 'פיתוח 8 הזרועות' שמעצים פרודוקטיביות קיצונית בתוך 4 ספרינטים. להרחבה ורישום: [קישור לדף הנחיתה של הסדנה].`
            },
            { 
                keywords: ['מחיר', 'כמה עולה', 'עלות', 'תקציב'],
                response: `[ERROR] לא ניתן לספק תמחור גנרי. הפתרונות שלנו מבוססים על כיול מערכתי. אנא קבע שיחה קצרה דרך ה-CTA הראשי כדי שנאבחן את המודולים הנדרשים.`
            },
            { 
                keywords: ['אסטרטגיה', 'מודל עסקי', 'שוק', 'כיוון'],
                response: `[STATUS] אני כאן לאבחן לעומק את הצרכים שלך. בוא/י נקבע שיחת ייעוץ אסטרטגית להתאמת פתרון מדויק. לחץ על ה-CTA למעלה כדי להתחיל כיול.`
            }
        ]
    };


    /**
     * @description מוסיף הודעה חדשה לקונסולה (סימולציית כתיבה מהירה)
     */
    function addMessage(text, sender = 'bot', className = 'text-green-400') {
        const msgContainer = document.createElement('div');
        const prefix = sender === 'bot' ? '' : '\[USER]: ';
        msgContainer.classList.add('code-font', 'mb-2', className);
        
        botOutput.appendChild(msgContainer);
        botOutput.scrollTop = botOutput.scrollHeight;

        // סימולציית הקלדה
        let i = 0;
        const speed = 15; // מ"ש
        function typeWriter() {
            if (i < text.length) {
                // הוספת הקידומת רק בתחילת ההקלדה של הבוט
                if (i === 0 && sender === 'bot') {
                     msgContainer.textContent = text.match(/\[(SYSTEM|STATUS|ERROR|CASE LOAD)\]/)[0] + ' ';
                     i = msgContainer.textContent.length - 2; // מתחילים אחרי הקידומת
                } else {
                    msgContainer.textContent += text.charAt(i);
                }
                
                i++;
                botOutput.scrollTop = botOutput.scrollHeight;
                setTimeout(typeWriter, speed);
            }
        }
        typeWriter();
    }

    /**
     * @description מטפל בלוגיקת השאלה החופשית (זיהוי כוונות)
     */
    function handleInputSend() {
        const userText = botInput.value.trim();
        if (userText === '') return;

        addMessage(userText, 'user', 'text-white');
        botInput.value = '';
        
        const userMsgNormalized = userText.toLowerCase();

        // 1. נסה לזהות כוונת מפתח (מחיר, סדנה, אסטרטגיה)
        for (const item of SOLUTION_BOT_DATA.intents) {
            if (item.keywords.some(kw => userMsgNormalized.includes(kw))) {
                setTimeout(() => addMessage(item.response, 'bot'), 800);
                return;
            }
        }

        // 2. נסה לזהות בחירה מספרית (אם משתמש מקליד 1, 2, או 3)
        if (userMsgNormalized === '1' || userMsgNormalized.includes('acquisition')) {
            handlePromptClick('leads', true);
            return;
        }
        if (userMsgNormalized === '2' || userMsgNormalized.includes('efficiency')) {
            handlePromptClick('automation', true);
            return;
        }
        if (userMsgNormalized === '3' || userMsgNormalized.includes('branding')) {
            handlePromptClick('branding', true);
            return;
        }

        // 3. מענה לשאלות כלליות/סתמיות
        setTimeout(() => {
            addMessage(`[STATUS] הבוט הזה ממוקד פתרונות עסקיים בלבד. אנא בחר אתגר מרשימת המספרים או שאל שאלה ספציפית על אוטומציה או לידים.`, 'bot', 'text-gray-400');
        }, 800);
    }

    /**
     * @description מטפל בלחיצה על כפתורי ה-Prompt (מסנן את הפורטפוליו)
     */
    function handlePromptClick(challenge, isTyped = false) {
        if (!isTyped) {
            // הוספת ההודעה של המשתמש רק אם זה מכפתור
            const btnText = document.querySelector(`.bot-prompt-btn[data-challenge="${challenge}"]`).textContent;
            addMessage(btnText, 'user', 'text-white');
        }
        
        setTimeout(() => {
            const caseStudy = SOLUTION_BOT_DATA.caseStudies[challenge];
            if (caseStudy) {
                const response = `[CASE LOAD] ${caseStudy.title}. הבעיה: ${caseStudy.text.split('הבעיה: ')[1]}. רוצה לקבל הצעת מחיר? לחץ על ה-CTA \[INIT] למעלה.`;
                addMessage(response, 'bot', 'text-yellow-400');
            } else {
                addMessage('\[ERROR]: לא נמצאו נתונים עבור אתגר זה.', 'bot', 'text-red-400');
            }
            
            // הסתרת הכפתורים לאחר בחירה
            promptButtons.forEach(btn => btn.style.display = 'none');
        }, 8
